title: NinjaMenu
description: >-
  A terminal-based menu system that puts 50+ installation scripts at your
  fingertips. Stop hunting for install commands. Start getting things done.
baseurl: ""
url: "https://tool-box.ninja"

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme

color_scheme: ninjamenu
logo: "/assets/images/toolbox_ninja_logo_transparent.png"

permalink: pretty

aux_links:
  "GitHub":
    - "https://github.com/alistairhendersoninfo/ninja_toolbox"

aux_links_new_tab: true

heading_anchors: true

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  NinjaMenu is MIT licensed.
  <a href="https://github.com/alistairhendersoninfo/ninja_toolbox">View on GitHub</a>.

last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/alistairhendersoninfo/ninja_toolbox"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
