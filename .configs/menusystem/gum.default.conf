# Gum Backend — Factory Defaults
# These values are used by "Reset Gum to Defaults" in Settings

# Border style: none, normal, rounded, double, thick
gum.border=rounded
gum.border_foreground=99

# Colors (use 256-color codes)
# Common: 39=cyan, 99=purple, 212=pink, 240=gray, 40=green, 196=red
gum.header_foreground=99
gum.match_foreground=212
gum.cursor_foreground=212
gum.prompt_foreground=240

# Dimensions
gum.width=60
gum.height=15
gum.padding=1

# Indicators
gum.cursor=>
gum.selected_prefix=✓
gum.unselected_prefix=•
