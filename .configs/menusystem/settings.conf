# Menu System Settings
# Backend options: gum, whiptail, textual
# gum = modern, stylish (default)
# whiptail = classic ncurses dialog
# textual = Python rich TUI

backend=gum

# ===========================================
# GUM STYLE SETTINGS
# ===========================================
# These only apply when backend=gum

# Border style: none, hidden, normal, rounded, double, thick
gum.border=double

# Colors (use 256-color codes or hex)
# Common: 39=cyan, 99=purple, 212=pink, 240=gray, 40=green, 196=red
gum.border_foreground=39
gum.header_foreground=99
gum.match_foreground=212
gum.cursor_foreground=212
gum.prompt_foreground=240

# Dimensions
gum.width=60
gum.height=15
gum.padding=1

# Indicators
gum.cursor=>
gum.selected_prefix=✓
gum.unselected_prefix=•

# ===========================================
# WHIPTAIL STYLE SETTINGS
# ===========================================
# These only apply when backend=whiptail
# Uses NEWT_COLORS environment variable format

# Color scheme: default, green, blue, red
whiptail.theme=default
