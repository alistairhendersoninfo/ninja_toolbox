# Menu System Settings — Factory Defaults
# Backend options: gum, whiptail, textual
# gum = modern, stylish (default)
# whiptail = classic ncurses dialog
# textual = Python rich TUI

backend=gum

# ===========================================
# LAYOUT SETTINGS
# ===========================================
# Maximum content width in characters (menu centered within terminal)
layout.max_width=80

# Alignment: center = centered in terminal, left = flush left
layout.alignment=center

# ===========================================
# GUM STYLE SETTINGS
# ===========================================
# These only apply when backend=gum

# Border style: none, normal, rounded, double, thick
gum.border=rounded
gum.border_foreground=99

# Colors (use 256-color codes)
# Common: 39=cyan, 99=purple, 212=pink, 240=gray, 40=green, 196=red
gum.header_foreground=99
gum.match_foreground=212
gum.cursor_foreground=212
gum.prompt_foreground=240

# Dimensions
gum.width=60
gum.height=15
gum.padding=1

# Indicators
gum.cursor=>
gum.selected_prefix=✓
gum.unselected_prefix=•

# ===========================================
# TEXTUAL STYLE SETTINGS
# ===========================================
# These only apply when backend=textual

# Theme: textual-dark, textual-light, textual-ansi, nord, gruvbox, tokyo-night,
#   monokai, dracula, catppuccin-mocha, catppuccin-latte, solarized-dark,
#   solarized-light, atom-one-dark, atom-one-light, flexoki, rose-pine, etc.
textual.theme=textual-dark

# ===========================================
# WHIPTAIL STYLE SETTINGS
# ===========================================
# These only apply when backend=whiptail
# Uses NEWT_COLORS environment variable format

# Color scheme: default, green, blue, red
whiptail.theme=default
