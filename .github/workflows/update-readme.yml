name: Update README

on:
  push:
    branches: [main]
    paths:
      - 'mainmenu/**'

jobs:
  check-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Rebuild cache and check README
        id: check
        run: |
          python3 .app/cache.py 2>/dev/null || true
          python3 -c "
          import sys
          sys.path.insert(0, '.app')
          from cache import rebuild_cache
          from pathlib import Path
          rebuild_cache(Path('mainmenu'), Path('.cache/menu.db'))
          "
          python3 .app/readme_gen.py --check-only
        continue-on-error: true

      - name: Update README
        if: steps.check.outcome == 'failure'
        run: python3 .app/readme_gen.py

      - name: Create PR if changed
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet README.md && exit 0
          BRANCH="auto/update-readme-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add README.md
          git commit -m "docs: auto-update README from menu cache

          Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "docs: auto-update README script counts" \
            --body "$(cat <<'EOF'
          ## Summary
          - README 'What's Included' section updated with current script counts from SQLite cache
          - Triggered automatically by changes to `mainmenu/`

          🤖 Generated by the update-readme workflow
          EOF
          )"
